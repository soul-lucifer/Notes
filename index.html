<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Note Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 50px; background-color: #f8f9fa; }
        .container { max-width: 800px; }
        #notes { white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Upload PDF or PPTX to Generate Notes</h1>
        <form id="uploadForm">
            <div class="mb-3">
                <input type="file" class="form-control" id="fileInput" accept=".pdf,.pptx" required>
            </div>
            <button type="submit" class="btn btn-primary">Generate Notes</button>
        </form>
        <div id="loading" class="mt-3" style="display: none;">Processing...</div>
        <div id="result" class="mt-4 card" style="display: none;">
            <div class="card-body">
                <h5 class="card-title">Generated Notes</h5>
                <pre id="notes"></pre>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', document.getElementById('fileInput').files[0]);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    document.getElementById('notes').textContent = data.notes;
                    document.getElementById('result').style.display = 'block';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
